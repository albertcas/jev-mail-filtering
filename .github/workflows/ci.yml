name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run build
        env: { DEMO_MODE: "1" }
  integration:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.0
        ports: ["3025:3025", "3143:3143", "8080:8080"]
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration
        env: { GREENMAIL: "1" }
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  package:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm pack
      - name: Tarball must not contain .env files
        shell: bash
        run: |
          if tar -tzf jev-mail-filtering-*.tgz | grep -E '(^|/)\.env'; then
            echo "::error::the npm tarball contains .env files"; exit 1
          fi
      - shell: bash
        run: |
          mkdir -p /tmp/try && cd /tmp/try && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/jev-mail-filtering-*.tgz
          (npx jev-mail-filtering --demo --no-open > server.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3737/api/status | grep -q '"demo":true'; then echo "server up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::demo server did not answer within 60 s"; cat server.log; exit 1
